<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ideia no Bolso • Soluções Tecnológicas</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >

  <!-- SweetAlert2 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">

  <!-- JsBarcode apenas para CODE39 -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/barcodes/JsBarcode.code39.min.js"></script>
  <!-- jsPDF para gerar PDF -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="app-title">Ideia no Bolso • Soluções Tecnológicas</h1>
  </header>

  <main class="container main-box">
    <h2 class="mb-3 text-center">Gerador de Código de Barras Code39</h2>

    <form id="config-form" class="row g-3">
      <div class="col-12 col-md-4">
        <label for="pdf-name" class="form-label">Nome do arquivo PDF</label>
        <input type="text" id="pdf-name" class="form-control form-control-sm" placeholder="ex.: etiquetas_estoque" value="codigos_barras_code39">
      </div>

      <div class="col-6 col-md-2">
        <label for="range-start" class="form-label">Número inicial</label>
        <input type="text" id="range-start" class="form-control form-control-sm" value="001">
      </div>

      <div class="col-6 col-md-2">
        <label for="range-end" class="form-label">Número final</label>
        <input type="text" id="range-end" class="form-control form-control-sm" value="100">
      </div>

      <div class="col-6 col-md-2">
        <label for="barcode-height" class="form-label">Altura código (mm)</label>
        <input type="number" id="barcode-height" class="form-control form-control-sm" value="30" min="5" max="300">
      </div>

      <div class="col-6 col-md-2">
        <label for="barcode-width" class="form-label">Largura código (mm)</label>
        <input type="number" id="barcode-width" class="form-control form-control-sm" value="30" min="5" max="30">
      </div>

      <div class="col-6 col-md-3">
        <label for="font-family" class="form-label">Fonte do texto</label>
        <select id="font-family" class="form-select form-select-sm">
          <option value="Arial" selected>Arial</option>
          <option value="Times New Roman">Times New Roman</option>
        </select>
      </div>

      <div class="col-6 col-md-3">
        <label for="font-size" class="form-label">Tamanho do texto (pt)</label>
        <input type="number" id="font-size" class="form-control form-control-sm" value="85" min="6" max="200">
      </div>

      <div class="col-6 col-md-3">
        <label for="text-position" class="form-label">Posição do número</label>
        <select id="text-position" class="form-select form-select-sm">
          <option value="bottom" selected>Embaixo do código</option>
          <option value="top">Em cima do código</option>
        </select>
      </div>

      <div class="col-6 col-md-3">
        <label for="label-width-mm" class="form-label">Largura do quadrado (mm)</label>
        <input type="number" id="label-width-mm" class="form-control form-control-sm" value="39" min="10" max="300">
      </div>

      <div class="col-6 col-md-3">
        <label for="label-height-mm" class="form-label">Altura do quadrado (mm)</label>
        <input type="number" id="label-height-mm" class="form-control form-control-sm" value="40" min="10" max="300">
      </div>

      <div class="col-6 col-md-3">
        <label for="pdf-format" class="form-label">Formato do PDF</label>
        <select id="pdf-format" class="form-select form-select-sm">
          <option value="A4" selected>A4 (210 x 297 mm)</option>
          <option value="A3">A3 (297 x 420 mm)</option>
          <option value="SUPER_A3">Super A3 (330 x 440 mm)</option>
          <option value="A2">A2 (420 x 594 mm)</option>
          <option value="A1">A1 (594 x 841 mm)</option>
        </select>
      </div>

      <div class="col-12 col-md-5">
        <label class="form-label d-block">Estilo do texto</label>
        <div class="btn-group btn-group-sm" role="group">
          <button type="button" id="btn-bold" class="btn btn-outline-primary style-btn">N</button>
          <button type="button" id="btn-italic" class="btn btn-outline-primary style-btn"><i>I</i></button>
          <button type="button" id="btn-underline" class="btn btn-outline-primary style-btn"><u>U</u></button>
        </div>
        <input type="hidden" id="font-bold" value="0">
        <input type="hidden" id="font-italic" value="0">
        <input type="hidden" id="font-underline" value="0">
      </div>

      <div class="col-12 d-flex justify-content-center gap-2 mt-2">
        <button type="button" id="generate-preview" class="btn btn-primary btn-sm px-4">
          Pré-visualizar
        </button>
        <button type="button" id="generate-pdf" class="btn btn-success btn-sm px-4">
          Gerar PDF
        </button>
      </div>
    </form>

    <h2 class="mt-4 mb-2 text-center">Pré-visualização</h2>
    <div id="preview-area"></div>
  </main>

  <footer id="footer-text"></footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>

  <script src="script.js"></script>
</body>
</html>
